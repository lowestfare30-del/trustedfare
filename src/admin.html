<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustedFare Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05080d;color:#f4f5f6;font-family:Inter,sans-serif;min-height:100vh}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(5,8,13,.95);border-bottom:1px solid rgba(213,173,85,.3)}
.logo{font-family:Cinzel,serif;font-weight:700;letter-spacing:2px;color:#f1d98b}
main{max-width:900px;margin:auto;padding:20px}
.login-box{max-width:400px;margin:80px auto;background:#0c121a;border:1px solid rgba(213,173,85,.3);border-radius:16px;padding:30px;text-align:center}
.login-box h2{font-family:Cinzel,serif;color:#f1d98b;letter-spacing:2px;margin-bottom:20px}
.login-box input{width:100%;padding:14px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.05);color:white;font-size:14px;margin-bottom:15px;outline:none}
.login-box input:focus{border-color:#d5ad55}
.login-box button{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(100deg,#9c7024,#f2d37d,#9c7024);color:#080b0e;font-weight:700;cursor:pointer;font-size:14px}
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:#0c121a;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:15px;text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:#f1d98b}
.stat-card .label{font-size:10px;color:#8994a1;margin-top:4px;letter-spacing:1px}
.booking-card{background:#0c121a;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:12px}
.booking-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.booking-id{font-family:Cinzel,serif;color:#f1d98b;font-size:14px;letter-spacing:1px}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.5px}
.badge.pending{background:rgba(255,180,60,.15);color:#ffb43c;border:1px solid rgba(255,180,60,.3)}
.badge.verified{background:rgba(80,200,120,.15);color:#67d39a;border:1px solid rgba(80,200,120,.3)}
.badge.rejected{background:rgba(255,90,90,.15);color:#ff7777;border:1px solid rgba(255,90,90,.3)}
.badge.confirmed{background:rgba(80,160,255,.15);color:#65dfff;border:1px solid rgba(80,160,255,.3)}
.booking-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:#8994a1;margin-bottom:10px}
.booking-details strong{color:#f4f5f6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:9px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-approve{background:rgba(80,200,120,.2);color:#67d39a;border:1px solid rgba(80,200,120,.4)!important}
.btn-reject{background:rgba(255,90,90,.2);color:#ff7777;border:1px solid rgba(255,90,90,.4)!important}
.btn-ticket{background:rgba(80,160,255,.2);color:#65dfff;border:1px solid rgba(80,160,255,.4)!important}
.ticket-form{display:none;margin-top:10px;padding:12px;background:rgba(255,255,255,.03);border-radius:8px;gap:8px;flex-wrap:wrap}
.ticket-form.show{display:flex}
.ticket-form input{flex:1;min-width:120px;padding:10px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.05);color:white;font-size:12px;outline:none}
.ticket-form button{padding:10px 14px;border:none;border-radius:6px;background:#d5ad55;color:#080b0e;font-weight:700;cursor:pointer}
.err{color:#ff7777;font-size:12px;margin-top:10px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.booking-details{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">TRUSTEDFARE ADMIN</div></header>
<main>
<div class="login-box" id="loginBox">
<h2>ADMIN LOGIN</h2>
<input type="password" id="adminPass" placeholder="Enter admin password">
<button onclick="login()">LOGIN</button>
<div class="err" id="loginErr"></div>
</div>
<div id="adminPanel" class="hidden">
<div class="stats">
<div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">TOTAL</div></div>
<div class="stat-card"><div class="num" id="statPending">0</div><div class="label">PENDING</div></div>
<div class="stat-card"><div class="num" id="statVerified">0</div><div class="label">VERIFIED</div></div>
<div class="stat-card"><div class="num" id="statConfirmed">0</div><div class="label">CONFIRMED</div></div>
</div>
<div id="bookingsList"></div>
</div>
</main>
<script>
var token="";
function login(){
var pass=document.getElementById("adminPass").value;
fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass})}).then(function(r){return r.json()}).then(function(res){
if(res.success){token=res.token;document.getElementById("loginBox").classList.add("hidden");document.getElementById("adminPanel").classList.remove("hidden");loadBookings()}
else{document.getElementById("loginErr").textContent=res.message||"Invalid password"}}).catch(function(){document.getElementById("loginErr").textContent="Login failed"})}
function loadBookings(){
fetch("/api/admin/bookings",{headers:{"Authorization":"Bearer "+token}}).then(function(r){return r.json()}).then(function(res){
if(!res.success){document.getElementById("loginErr").textContent=res.message;return}
renderBookings(res.bookings||[])}).catch(function(){})}
function statusBadge(s){if(s==="pending_payment"||s==="payment_pending")return'<span class="badge pending">PENDING PAYMENT</span>';if(s==="processing")return'<span class="badge verified">VERIFIED</span>';if(s==="confirmed")return'<span class="badge confirmed">CONFIRMED</span>';if(s==="payment_rejected")return'<span class="badge rejected">REJECTED</span>';return'<span class="badge pending">'+s+'</span>'}
function renderBookings(bookings){
document.getElementById("statTotal").textContent=bookings.length;
var pending=bookings.filter(function(b){return b.status==="pending_payment"||b.status==="payment_pending"}).length;
var verified=bookings.filter(function(b){return b.status==="processing"}).length;
var confirmed=bookings.filter(function(b){return b.status==="confirmed"}).length;
document.getElementById("statPending").textContent=pending;
document.getElementById("statVerified").textContent=verified;
document.getElementById("statConfirmed").textContent=confirmed;
var html="";
for(var i=0;i<bookings.length;i++){
var b=bookings[i];
html+='<div class="booking-card"><div class="booking-head"><span class="booking-id">'+b.id+'</span>'+statusBadge(b.status)+'</div>';
html+='<div class="booking-details"><div><strong>Route:</strong> '+b.origin+' to '+b.destination+'</div><div><strong>Departure:</strong> '+b.departure_date+(b.return_date?' (return '+b.return_date+')':'')+'</div>';
html+='<div><strong>Price:</strong> '+b.price_amount+' '+b.price_currency+'</div><div><strong>Cabin:</strong> '+b.cabin_class+'</div>';
html+='<div><strong>Customer:</strong> '+b.customer_name+'</div><div><strong>Phone:</strong> '+b.customer_mobile+'</div>';
html+='<div><strong>Email:</strong> '+b.customer_email+'</div><div><strong>UTR:</strong> '+(b.utr_reference||'-')+'</div>';
if(b.pnr)html+='<div><strong>PNR:</strong> '+b.pnr+'</div><div><strong>Ticket:</strong> '+(b.ticket_number||'-')+'</div>';
html+='</div><div class="actions">';
if(b.status==="pending_payment"||b.status==="payment_pending"){
html+='<button class="btn-approve" onclick="verifyBooking(\''+b.id+'\',\'approve\')">VERIFY PAYMENT</button>';
html+='<button class="btn-reject" onclick="verifyBooking(\''+b.id+'\',\'reject\')">REJECT</button>';
}
if(b.status==="processing"||b.status==="payment_pending"){
html+='<button class="btn-ticket" onclick="toggleTicket(\''+b.id+'\')">ADD TICKET</button>';
}
html+='</div><div class="ticket-form" id="ticket-'+b.id+'"><input type="text" id="pnr-'+b.id+'" placeholder="PNR"><input type="text" id="ticketnum-'+b.id+'" placeholder="Ticket number"><label style="font-size:9px;color:#d5ad55;margin:4px 0;display:block">TICKET COPY (PDF/JPG/PNG)</label><input type="file" id="ticketfile-'+b.id+'" accept=".pdf,.jpg,.jpeg,.png" style="flex:1;min-width:120px;padding:8px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.05);color:white;font-size:11px"><button onclick="addTicket(\''+b.id+'\')">SAVE</button></div></div>';
}
document.getElementById("bookingsList").innerHTML=html||'<div style="text-align:center;color:#8994a1;padding:40px">No bookings yet</div>';
}
function verifyBooking(id,action){
fetch("/api/admin/verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({booking_id:id,action:action})}).then(function(r){return r.json()}).then(function(res){alert(res.message||"Done");loadBookings()})}
function toggleTicket(id){var el=document.getElementById("ticket-"+id);el.classList.toggle("show")}
function addTicket(id){
var pnr=document.getElementById("pnr-"+id).value,tnum=document.getElementById("ticketnum-"+id).value;
var fileInput=document.getElementById("ticketfile-"+id);
if(!pnr){alert("PNR is required");return}
var fileData=null;
if(fileInput&&fileInput.files&&fileInput.files[0]){
var file=fileInput.files[0];
var reader=new FileReader();
reader.onload=function(){
fetch("/api/admin/ticket",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({booking_id:id,pnr:pnr,ticket_number:tnum,ticket_file_data:reader.result,ticket_filename:file.name,ticket_filetype:file.type})}).then(function(r){return r.json()}).then(function(res){alert(res.message||"Done");loadBookings()})};
reader.readAsDataURL(file);
}else{
fetch("/api/admin/ticket",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({booking_id:id,pnr:pnr,ticket_number:tnum})}).then(function(r){return r.json()}).then(function(res){alert(res.message||"Done");loadBookings()})}}
</script>
</body>
</html>

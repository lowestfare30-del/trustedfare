name = "trustedfare-seo"
main = "src/worker.js"
compatibility_date = "2025-05-01"

[[services]]
binding = "SERVICE"
service = "trustedfare"

# Secrets (set via `wrangler secret put`):
#   IGNAV_API_KEY  — API key for ignav.com flight search
#   WEB3FORMS_KEY  — API key for web3forms.com email notifications
#   ADMIN_PASSWORD — Admin panel password (default: trustedfare2026)

# Static assets — pointed at ./public (contains only a placeholder .gitkeep)
# so that node_modules/ is NEVER scanned for assets.
# run_worker_first = true ensures the Worker handles ALL routing, since
# every page (/, /admin, /robots.txt, /sitemap.xml, /flights/*, /api/*)
# is generated dynamically by the Worker.
[assets]
directory = "./public"
run_worker_first = true

[[kv_namespaces]]
binding = "ENQUIRIES"
id = "ec560cf760624dd9be138092d04d76b3"

[[d1_databases]]
binding = "DB"
database_name = "trustedfare-bookings"
database_id = "1f2eda1b-92ba-4633-8fcf-bc7a3d6f43b7"

# Routes
[[routes]]
pattern = "trustedfare.com/*"
zone_name = "trustedfare.com"

[[routes]]
pattern = "*.trustedfare.com/*"
zone_name = "trustedfare.com"

# Custom domains
[[routes]]
pattern = "trustedfare.com"
zone_name = "trustedfare.com"
custom_domain = true

[[routes]]
pattern = "www.trustedfare.com"
zone_name = "trustedfare.com"
custom_domain = true

[[routes]]
pattern = "skyscanner.trustedfare.com"
zone_name = "trustedfare.com"
custom_domain = true
